var TOTAL_LESSONS = 0;
for (var k in COURSES) { TOTAL_LESSONS += COURSES[k].lessons.length; }

// ======================== STATE ========================
var STATE_KEY = 'codegreen_state_v3';
function getDefaultState() { return { completedLessons: [], codeSnippets: {}, lastVisited: null, introShown: false }; }
function loadState() { try { var r = localStorage.getItem(STATE_KEY); if (r) { var p = JSON.parse(r); var d = getDefaultState(); for (var k in d) { if (p[k] !== undefined) d[k] = p[k]; } return d; } } catch(e) {} return getDefaultState(); }
function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) {} }
var state = loadState();
function isCompleted(lid) { return state.completedLessons.indexOf(lid) !== -1; }
function markCompleted(lid) { if (!isCompleted(lid)) { state.completedLessons.push(lid); saveState(); } }
function getCourseProgress(cid) { var c = COURSES[cid]; var d = 0; for (var i = 0; i < c.lessons.length; i++) { if (isCompleted(c.lessons[i].id)) d++; } return { completed: d, total: c.lessons.length, percent: c.lessons.length > 0 ? Math.round((d / c.lessons.length) * 100) : 0 }; }
function getOverallProgress() { return { completed: state.completedLessons.length, total: TOTAL_LESSONS, percent: TOTAL_LESSONS > 0 ? Math.round((state.completedLessons.length / TOTAL_LESSONS) * 100) : 0 }; }

// ======================== TOAST ========================
function showToast(message, type) {
    type = type || 'success';
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    var cols = { success: 'bg-emerald-600', error: 'bg-red-500', info: 'bg-slate-700' };
    var icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
    t.className = 'pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-xl text-white text-sm font-semibold shadow-lg ' + (cols[type]||cols.info) + ' toast-enter';
    t.innerHTML = '<i data-lucide="' + (icons[type]||icons.info) + '" class="w-5 h-5 flex-shrink-0"></i><span>' + message + '</span>';
    c.appendChild(t); lucide.createIcons({ nodes: [t] });
    setTimeout(function() { t.classList.remove('toast-enter'); t.classList.add('toast-exit'); t.addEventListener('animationend', function() { if (t.parentNode) t.parentNode.removeChild(t); }); }, 3000);
}

var modalCallback = null;
function showModal(title, message, confirmText, onConfirm, btnClass) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;
    var btn = document.getElementById('modal-confirm');
    btn.textContent = confirmText;
    btn.className = 'px-5 py-2.5 rounded-xl text-white font-semibold transition-colors ' + (btnClass || 'bg-red-500 hover:bg-red-600');
    modalCallback = onConfirm;
    var o = document.getElementById('modal-overlay'); o.classList.remove('hidden'); o.classList.add('flex');
    try { anime({ targets:'#modal-box', scale:[0.9,1], opacity:[0,1], duration:300, easing:'easeOutCubic' }); } catch(e) {}
}
function closeModal() { var o = document.getElementById('modal-overlay'); o.classList.add('hidden'); o.classList.remove('flex'); modalCallback = null; }
document.getElementById('modal-confirm').addEventListener('click', function() { if (modalCallback) modalCallback(); closeModal(); });
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); });
function confirmReset() { showModal('Reset All Progress?', 'This will erase all completed lessons and saved code. This cannot be undone.', 'Reset Everything', function() { state = getDefaultState(); state.introShown = true; saveState(); showDashboard(); showToast('All progress has been reset', 'info'); }); }

// ======================== CELEBRATION ========================
function celebrate() {
    var c = document.getElementById('celebration'); c.classList.remove('hidden'); c.innerHTML = '';
    var cols = ['#10b981','#059669','#34d399','#6ee7b7','#fbbf24','#f59e0b'];
    for (var i = 0; i < 50; i++) {
        var p = document.createElement('div'); var sz = Math.random()*10+5;
        p.style.cssText = 'position:absolute;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>0.5?'50%':'2px')+';top:50%;left:50%;';
        c.appendChild(p);
        (function(el) { anime({ targets:el, translateX:anime.random(-400,400), translateY:anime.random(-500,-50), rotate:anime.random(0,720), scale:[1,0], opacity:[1,0], duration:anime.random(800,1800), easing:'easeOutExpo', delay:anime.random(0,200), complete:function(){if(el.parentNode)el.parentNode.removeChild(el);} }); })(p);
    }
    setTimeout(function() { c.classList.add('hidden'); c.innerHTML = ''; }, 2200);
}

// ======================== VIEWS ========================
var app = document.getElementById('app');
var currentCourseId = null, currentLessonIdx = null;

function updateNavProgress() { var o = getOverallProgress(); document.getElementById('nav-progress-bar').style.width = o.percent+'%'; document.getElementById('nav-progress-text').textContent = o.completed+'/'+o.total+' lessons'; }

function escHTML(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showDashboard() {
    currentCourseId = null; currentLessonIdx = null;
    var overall = getOverallProgress();
    var cardsHTML = '';
    var courseIds = ['html','css','js','cpp','kotlin','python'];
    var isFirst = true;
    for (var ci = 0; ci < courseIds.length; ci++) {
        var id = courseIds[ci], course = COURSES[id], prog = getCourseProgress(id), isDone = prog.percent === 100;
        var introAttr = isFirst ? ' data-intro="Here are your courses. Click any card to start learning!"' : ''; isFirst = false;
        cardsHTML += '<div class="card-lift bg-white rounded-2xl border '+(isDone?'border-emerald-300 ring-2 ring-emerald-100':'border-slate-200')+' overflow-hidden cursor-pointer group" onclick="showCourse(\''+id+'\')"'+introAttr+'><div class="h-2 bg-gradient-to-r from-emerald-400 to-emerald-600"></div><div class="p-6"><div class="flex items-start justify-between mb-4"><div class="w-12 h-12 rounded-xl '+course.accentBg+' flex items-center justify-center"><i data-lucide="'+course.icon+'" class="w-6 h-6 '+course.accentText+'"></i></div>'+(isDone?'<span class="flex items-center gap-1 text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full"><i data-lucide="trophy" class="w-3.5 h-3.5"></i>Done</span>':'')+'</div><h3 class="text-xl font-extrabold text-slate-900 mb-1.5">'+course.name+'</h3><p class="text-slate-500 text-sm leading-relaxed mb-5">'+course.description+'</p><div class="mb-3"><div class="flex justify-between text-xs font-semibold mb-1.5"><span class="text-slate-500">'+prog.completed+' of '+prog.total+' lessons</span><span class="'+(isDone?'text-emerald-600':'text-slate-500')+'">'+prog.percent+'%</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full progress-fill bg-gradient-to-r from-emerald-400 to-emerald-600" style="width:'+prog.percent+'%"></div></div></div><div class="flex items-center gap-1.5 text-sm font-bold '+(prog.completed>0?'text-emerald-600':'text-slate-400')+' group-hover:text-emerald-600 transition-colors">'+(prog.completed>0?'Continue Learning':'Start Learning')+' <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i></div></div></div>';
    }
    app.innerHTML = '<div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-16"><section class="text-center mb-14" id="hero-section"><div class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 text-sm font-semibold px-4 py-1.5 rounded-full mb-5"><i data-lucide="sparkles" class="w-4 h-4"></i>Free Interactive Coding Lessons</div><h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight leading-tight mb-4">Learn to Code<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-emerald-700">From Scratch</span></h1><p class="text-lg text-slate-500 max-w-2xl mx-auto leading-relaxed mb-8">Master HTML, CSS, JavaScript, C++, Kotlin, and Python with hands-on lessons. Write real code, see instant results, and track your progress.</p><div class="inline-flex items-center gap-4 sm:gap-6 bg-slate-50 rounded-2xl px-5 sm:px-8 py-4" id="stats-section"><div class="text-center"><div class="text-2xl font-black text-emerald-600">'+overall.completed+'</div><div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Done</div></div><div class="w-px h-10 bg-slate-200"></div><div class="text-center"><div class="text-2xl font-black text-slate-700">'+(overall.total-overall.completed)+'</div><div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Left</div></div><div class="w-px h-10 bg-slate-200"></div><div class="text-center"><div class="text-2xl font-black text-slate-700">'+overall.percent+'%</div><div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Overall</div></div></div></section><section class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6" id="courses-section">'+cardsHTML+'</section><footer class="mt-20 text-center text-sm text-slate-400"><p>Built for learners. All progress saved locally in your browser.</p><p class="mt-1">CodeGreen &mdash; Start your coding journey today.</p></footer></div>';
    updateNavProgress(); lucide.createIcons();
    try { anime({ targets:'.card-lift', translateY:[30,0], opacity:[0,1], delay:anime.stagger(80,{start:200}), duration:600, easing:'easeOutCubic' }); anime({ targets:'#hero-section > *', translateY:[20,0], opacity:[0,1], delay:anime.stagger(80), duration:500, easing:'easeOutCubic' }); } catch(e) {}
    if (!state.introShown) { state.introShown = true; saveState(); setTimeout(startTour, 800); }
}

function showCourse(courseId) {
    currentCourseId = courseId; currentLessonIdx = null;
    var course = COURSES[courseId], prog = getCourseProgress(courseId), isDone = prog.percent === 100, lessonsHTML = '';
    for (var i = 0; i < course.lessons.length; i++) {
        var lesson = course.lessons[i], done = isCompleted(lesson.id);
        var isNext = !done && (i === 0 || isCompleted(course.lessons[i-1].id));
        var cc = done ? 'bg-emerald-500 text-white' : isNext ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400';
        var rc = done ? 'bg-emerald-50/60 hover:bg-emerald-50' : isNext ? 'bg-white border-2 border-emerald-200 hover:border-emerald-300 shadow-sm' : 'bg-white border border-slate-100 hover:bg-slate-50';
        var tc = done ? 'line-through text-slate-400' : '';
        var ci = done ? '<i data-lucide="check" class="w-5 h-5"></i>' : String(i+1);
        var dot = isNext && !done ? '<span class="pulse-dot w-2.5 h-2.5 bg-emerald-500 rounded-full flex-shrink-0"></span>' : '';
        var tl = lesson.type === 'js' ? 'Console Output' : lesson.type === 'code' ? 'Read & Practice' : 'Live Preview';
        lessonsHTML += '<div class="lesson-item flex items-center gap-4 p-4 rounded-xl cursor-pointer '+rc+' transition-all" onclick="showLesson(\''+courseId+'\','+i+')"><div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 '+cc+' font-bold text-sm">'+ci+'</div><div class="flex-1 min-w-0"><div class="font-semibold text-slate-800 '+tc+'">'+lesson.title+'</div><div class="text-xs text-slate-400 mt-0.5">'+tl+'</div></div>'+dot+'<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 flex-shrink-0"></i></div>';
    }
    var trophy = isDone ? '<div class="mb-6 bg-emerald-50 border border-emerald-200 rounded-xl p-5 flex items-center gap-4"><div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="trophy" class="w-6 h-6 text-white"></i></div><div><div class="font-bold text-emerald-800">Course Completed!</div><div class="text-sm text-emerald-600">You finished all '+course.name+' lessons. Great work!</div></div></div>' : '';
    app.innerHTML = '<div class="max-w-3xl mx-auto px-4 sm:px-6 py-10"><button onclick="showDashboard()" class="flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-emerald-600 transition-colors mb-8 group"><i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>Back to Courses</button><div class="flex items-center gap-4 mb-6"><div class="w-14 h-14 rounded-xl '+course.accentBg+' flex items-center justify-center"><i data-lucide="'+course.icon+'" class="w-7 h-7 '+course.accentText+'"></i></div><div><h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">'+course.name+'</h1><p class="text-slate-500 text-sm">'+prog.completed+' of '+prog.total+' completed</p></div></div>'+trophy+'<div class="mb-6"><div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full progress-fill bg-gradient-to-r from-emerald-400 to-emerald-600" style="width:'+prog.percent+'%"></div></div></div><div class="flex flex-col gap-2">'+lessonsHTML+'</div></div>';
    updateNavProgress(); lucide.createIcons();
    try { anime({ targets:'.lesson-item', translateX:[-20,0], opacity:[0,1], delay:anime.stagger(50,{start:100}), duration:400, easing:'easeOutCubic' }); } catch(e) {}
}

function showLesson(courseId, lessonIdx) {
    currentCourseId = courseId; currentLessonIdx = lessonIdx;
    var course = COURSES[courseId], lesson = course.lessons[lessonIdx];
    var done = isCompleted(lesson.id);
    var prevCode = state.codeSnippets[lesson.id] || lesson.starterCode;
    var previewLabel = lesson.type === 'html' ? 'Live Preview' : lesson.type === 'code' ? 'Expected Output' : 'Console Output';
    var runLabel = lesson.type === 'code' ? 'Show Output' : 'Run Code';
    var langNote = '';
    if (lesson.type === 'code') {
        langNote = '<div class="flex items-center gap-2 text-xs text-amber-600 bg-amber-50 px-3 py-2 rounded-lg mb-3"><i data-lucide="info" class="w-3.5 h-3.5 flex-shrink-0"></i><span>'+course.name+' code runs in a compiler, not in the browser. Edit for practice, then click "'+runLabel+'" to see the expected result.</span></div>';
    }
    var doneBtn = done ? '<button disabled class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-100 text-emerald-700 font-semibold text-sm cursor-default"><i data-lucide="check-circle" class="w-4 h-4"></i>Completed</button>' : '<button onclick="completeLesson()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold text-sm hover:bg-emerald-600 transition-colors run-pulse"><i data-lucide="check" class="w-4 h-4"></i>Mark Complete</button>';

    app.innerHTML = '<div class="max-w-6xl mx-auto px-4 sm:px-6 py-6"><div class="flex items-center justify-between mb-6"><button onclick="showCourse(\''+courseId+'\')" class="flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-emerald-600 transition-colors group"><i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>'+course.name+'</button><div class="flex items-center gap-2 text-sm text-slate-400"><span>'+course.lessons[lessonIdx].title+'</span><span class="text-slate-300">|</span><span>'+(lessonIdx+1)+'/'+course.lessons.length+'</span></div></div><div class="grid lg:grid-cols-2 gap-6"><div class="flex flex-col"><div class="flex items-center justify-between mb-3"><h2 class="text-lg font-bold text-slate-900">'+lesson.title+'</h2>'+doneBtn+'</div><div class="bg-slate-50 rounded-xl p-5 mb-4 text-sm text-slate-600 leading-relaxed border border-slate-100">'+lesson.content+'</div>'+langNote+'<div class="flex items-center justify-between mb-2"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Code Editor</span><button onclick="resetCode()" class="text-xs font-semibold text-slate-400 hover:text-red-500 transition-colors flex items-center gap-1"><i data-lucide="rotate-ccw" class="w-3 h-3"></i>Reset</button></div><textarea id="code-editor" class="code-editor w-full h-64 bg-slate-900 text-emerald-300 p-4 rounded-xl text-sm scrollbar-thin border border-slate-700 focus:border-emerald-500" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea><div class="mt-3 flex gap-2"><button onclick="runCode()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold text-sm hover:bg-emerald-600 transition-colors run-pulse"><i data-lucide="play" class="w-4 h-4"></i>'+runLabel+'</button></div><div class="mt-4 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800"><strong>Task:</strong> '+lesson.task+'</div></div><div class="flex flex-col"><div class="flex items-center mb-2"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">'+previewLabel+'</span></div><div id="preview-pane" class="flex-1 min-h-[400px] bg-white border border-slate-200 rounded-xl overflow-hidden"><div id="preview-content" class="w-full h-full"></div></div></div></div></div>';

    var editor = document.getElementById('code-editor');
    editor.value = prevCode;
    editor.addEventListener('input', function() { state.codeSnippets[lesson.id] = editor.value; saveState(); });
    editor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            var start = this.selectionStart, end = this.selectionEnd;
            this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 2;
            state.codeSnippets[lesson.id] = this.value; saveState();
        }
    });

    updateNavProgress(); lucide.createIcons();
    if (lesson.type === 'html') { runCode(); }
}

function runCode() {
    if (currentCourseId === null || currentLessonIdx === null) return;
    var lesson = COURSES[currentCourseId].lessons[currentLessonIdx];
    var code = document.getElementById('code-editor').value;
    var pane = document.getElementById('preview-content');

    if (lesson.type === 'html') {
        pane.innerHTML = code;
    } else if (lesson.type === 'code') {
        var expected = lesson.expectedOutput || 'No expected output provided.';
        pane.innerHTML = '<div class="p-4 bg-slate-900 h-full overflow-auto"><div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Expected Output</div><pre class="text-emerald-300 text-sm font-mono whitespace-pre-wrap leading-relaxed">' + escHTML(expected) + '</pre></div>';
    } else {
        var logs = [];
        var fakeConsole = { log: function() { var args = Array.prototype.slice.call(arguments); logs.push(args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : String(a); }).join(' ')); } };
        try {
            var fn = new Function('console', code);
            fn(fakeConsole);
        } catch(e) { logs.push('Error: ' + e.message); }
        pane.innerHTML = '<div class="p-4 bg-slate-900 h-full overflow-auto scrollbar-thin"><div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Console Output</div>' + (logs.length > 0 ? logs.map(function(l) { return '<div class="text-emerald-300 text-sm font-mono whitespace-pre-wrap leading-relaxed py-0.5 border-b border-slate-800 last:border-0">' + escHTML(l) + '</div>'; }).join('') : '<div class="text-slate-500 text-sm italic">No output yet.</div>') + '</div>';
    }
}

function resetCode() {
    if (currentCourseId === null || currentLessonIdx === null) return;
    var lesson = COURSES[currentCourseId].lessons[currentLessonIdx];
    document.getElementById('code-editor').value = lesson.starterCode;
    delete state.codeSnippets[lesson.id];
    saveState();
    showToast('Code reset to starter', 'info');
    if (lesson.type === 'html') { runCode(); }
}

function completeLesson() {
    if (currentCourseId === null || currentLessonIdx === null) return;
    var lesson = COURSES[currentCourseId].lessons[currentLessonIdx];
    markCompleted(lesson.id);
    celebrate();
    showToast('Lesson completed! Great job!', 'success');
    updateNavProgress();
    setTimeout(function() { showLesson(currentCourseId, currentLessonIdx); }, 600);
}

// ======================== TOUR ========================
function startTour() {
    if (typeof introJs === 'undefined') return;
    var intro = introJs();
    intro.setOptions({
        steps: [
            { element: '#nav-logo', intro: 'Click here anytime to return to the dashboard.' },
            { element: '#courses-section', intro: 'Browse all 6 courses here. Each has 8 hands-on lessons covering fundamentals to intermediate topics.' },
            { element: '#stats-section', intro: 'Your overall progress at a glance. Complete lessons to fill this up!' }
        ],
        showBullets: false,
        showStepNumbers: false,
        tooltipClass: 'custom-intro-tooltip'
    });
    intro.start();
}

// ======================== INIT ========================
showDashboard();
</script>
</body>
</html>
